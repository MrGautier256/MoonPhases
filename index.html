<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase Lunaire Actuelle</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="constellation" id="constellation"></div>

    <div class="container">
        <h1>Phase Lunaire</h1>

        <div class="date-controls">
            <div class="date-input-group">
                <button id="currentBtn" class="active">Aujourd'hui</button>
                <button id="customBtn">Date personnalisée</button>
            </div>
            <div id="dateInputContainer" style="display: none;">
                <input type="date" id="dateInput">
            </div>

            <!-- Location Controls -->
            <button id="toggleLocationBtn" class="location-toggle-btn">
                📍 Changer la Localisation
            </button>

            <div id="locationOptions" class="location-options" style="display: none;">
                <h4>📍 Localisation</h4>
                <div class="location-buttons">
                    <button id="currentLocationBtn" class="location-btn">
                        📍 Ma position
                    </button>
                    <button id="addressBtn" class="location-btn">
                        🏠 Adresse
                    </button>
                    <button id="mapBtn" class="location-btn">
                        🗺️ Carte
                    </button>
                </div>

                <div id="addressInput" class="address-input" style="display: none;">
                    <div class="address-input-row">
                        <input type="text" id="addressField" placeholder="Entrez une adresse..." autocomplete="off">
                        <button id="searchAddressBtn">Rechercher</button>
                    </div>
                    <div id="addressSuggestions" class="address-suggestions" style="display: none;"></div>
                </div>

                <div id="mapContainer"
                    style="display: none; height: 300px; margin-top: 10px; border-radius: 8px; overflow: hidden;"></div>
            </div>
        </div>

        <div class="loader" id="loader"></div>
        <div class="date-display" id="dateDisplay"></div>
        <div class="current-location" id="currentLocation"></div>
        <div class="moon-container">
            <img id="moonImage" src="" alt="Phase lunaire">
        </div>
        <div class="phase-name" id="phaseName"></div>
        <div class="illumination-percent" id="illuminationPercent"></div>
        <div class="sun-times">
            <div class="sun-time sunrise">
                <span class="label">🌅 Lever</span>
                <span class="time" id="sunriseTime"></span>
            </div>
            <div class="sun-time sunset">
                <span class="label">🌇 Coucher</span>
                <span class="time" id="sunsetTime"></span>
            </div>
        </div>
        <div class="error" id="errorMessage"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>

</html>
